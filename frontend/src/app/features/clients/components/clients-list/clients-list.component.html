<div class="container mt-5">
  <div class="row">
    <div class="col-md-12 mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <h2>Clientes</h2>
        <a [routerLink]="['/clients/create']" class="btn btn-primary">
          <i class="fas fa-plus"></i> Nuevo Cliente
        </a>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="loading">
    <div class="col-md-12 text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="error">
    <div class="col-md-12">
      <div class="alert alert-danger" role="alert">
        Ocurrió un error al cargar los clientes. Por favor, intente nuevamente.
      </div>
    </div>
  </div>

  <div class="row" *ngIf="!loading && !error">
    <div class="col-md-12">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of clients">
              <td>{{ client.id }}</td>
              <td>{{ client.nombre }}</td>
              <td>{{ client.apellido }}</td>
              <td>{{ client.email }}</td>
              <td>{{ client.telefono }}</td>
              <td>
                <div class="btn-group">
                  <a [routerLink]="['/clients/edit', client.id]" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-edit"></i> Editar
                  </a>
                  <button (click)="deleteClient(client.id)" class="btn btn-sm btn-outline-danger ms-2">
                    <i class="fas fa-trash"></i> Eliminar
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="clients.length === 0">
              <td colspan="6" class="text-center">No hay clientes registrados</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
